name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  TARGET_REPO: gozaoo-coder/Rein_hub

jobs:
  # ─── Windows Desktop ──────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build Windows desktop app
        run: npm run build:tauri
        env:
          # 禁用符号链接创建（CI 环境不支持）
          TAURI_CLI_NO_SYMLINK: '1'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            src-tauri/target/release/rein.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

  # ─── Android ─────────────────────────────────────────────────────
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-34
            build-tools;34.0.0
            ndk;27.0.12077973

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: npx tauri android init

      - name: Build Android APK
        run: npx tauri android build
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: |
            src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
            src-tauri/gen/android/app/build/outputs/apk/arm64/release/*.apk
            src-tauri/gen/android/app/build/outputs/apk/arm/release/*.apk
          if-no-files-found: warn

  # ─── HarmonyOS (manual only, requires DevEco toolchain) ──────────
  build-harmonyos:
    runs-on: ubuntu-latest
    if: false  # 暂时禁用，需要自定义 runner 或 Docker 镜像配置 DevEco 工具链
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-ohos

      - name: Install tauri-cli (feat/open-harmony)
        run: cargo install tauri-cli --git https://github.com/tauri-apps/tauri --branch feat/open-harmony

      - name: Install ohrs
        run: cargo install ohrs

      - name: Install dependencies
        run: npm ci

      - name: Build HarmonyOS HAP
        run: cargo tauri ohos build -t aarch64 --ci
        env:
          DEV_ECO_STUDIO_INSTALL_PATH: /opt/deveco
          JAVA_HOME: /opt/deveco/jbr
          HVIGOR_USER_HOME: ${{ github.workspace }}/src-tauri/gen/ohos/.hvigor

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: harmonyos-artifacts
          path: |
            src-tauri/gen/ohos/entry/build/default/outputs/default/*.hap
          if-no-files-found: warn

  # ─── Publish to Rein_hub ─────────────────────────────────────────
  release:
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          # Flatten and rename artifacts
          find artifacts -type f \( -name "*.exe" -o -name "*.msi" -o -name "*.apk" -o -name "*.hap" \) -exec cp {} release-assets/ \;
          # List final assets
          ls -la release-assets/

      - name: Create Release in Rein_hub
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          # If triggered manually, use run number as tag
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "$GITHUB_REF" ]; then
            TAG_NAME="v0.0.0-ci${{ github.run_number }}"
          fi

          echo "Creating release $TAG_NAME in $TARGET_REPO..."

          gh release create "$TAG_NAME" \
            --repo "$TARGET_REPO" \
            --title "Rein $TAG_NAME" \
            --notes "Automated release from private repo (commit ${{ github.sha }})" \
            release-assets/*

      - name: Summary
        run: |
          echo "## Release Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Tag: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "Repo: ${{ env.TARGET_REPO }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Assets" >> $GITHUB_STEP_SUMMARY
          ls release-assets/ | while read f; do
            echo "- \`$f\`" >> $GITHUB_STEP_SUMMARY
          done
