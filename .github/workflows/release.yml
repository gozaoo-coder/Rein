name: Release

# 打 tag 触发（`git tag v0.2.1 && git push origin v0.2.1`），也可以手动指定版本。
#
# 三个 job 的分工：
#   build-windows / build-android  各自构建平台产物（不发布）
#   publish                        统一签名、组装清单、发 GitHub Release + 推 Rein 在线服务
#
# 「构建」与「发布」分开是有意的：签名私钥只在 publish（与构建时读到的 .sig 复用）需要，
# 构建机不必持有发布凭据；产物也没必要在两台机器上各签一次。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（不带 v，例如 0.2.1；留空则用 package.json 里的版本）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-windows:
    name: 构建 · Windows NSIS
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # 端侧 embedding 素材不入库：模型 + Windows 运行库都得先拉
      - run: node scripts/fetch-embed-model.mjs
      - run: node scripts/fetch-ort-runtime.mjs --target win-x64
      - name: 构建（前端 + NSIS 安装包）
        run: npx tauri build
      - name: 收集产物
        shell: bash
        run: |
          mkdir -p dist-release-out
          cp src-tauri/target/release/bundle/nsis/*.exe dist-release-out/
          ls -lh dist-release-out
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist-release-out/*.exe
          if-no-files-found: error

  build-android:
    name: 构建 · Android APK
    runs-on: ubuntu-latest
    env:
      REIN_ANDROID_KEYSTORE_BASE64: ${{ secrets.REIN_ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      # Android 发布包必须用与既有安装同源的密钥签名（否则系统拒绝覆盖安装），
      # 所以没有 keystore secret 时这个 job 只做「能编译出来」的验证，不产出可发布 APK。
      - name: 检查签名密钥
        id: keystore
        run: |
          if [ -z "$REIN_ANDROID_KEYSTORE_BASE64" ]; then
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置 REIN_ANDROID_KEYSTORE_BASE64，Android 产物将不带发布签名（仅验证可编译）"
          else
            echo "have=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: 准备 Android SDK / NDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "NDK_HOME=$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/ndk/* 2>/dev/null | tail -n1)" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_HOME" >> "$GITHUB_ENV"
      - run: npm ci
      - run: node scripts/fetch-embed-model.mjs
      - run: node scripts/fetch-ort-runtime.mjs --target android-arm64
      - name: 写入签名配置
        if: steps.keystore.outputs.have == 'true'
        run: |
          echo "$REIN_ANDROID_KEYSTORE_BASE64" | base64 -d > src-tauri/rein-release.keystore
          cat > src-tauri/gen/android/keystore.properties <<EOF
          storeFile=../../rein-release.keystore
          storePassword=${{ secrets.REIN_ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.REIN_ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.REIN_ANDROID_KEY_PASSWORD }}
          EOF
      - name: 构建 APK（arm64）
        run: npx tauri android build --apk --target aarch64
      - name: 收集产物
        shell: bash
        run: |
          mkdir -p dist-release-out
          find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -exec cp {} dist-release-out/ \;
          ls -lh dist-release-out
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist-release-out/*.apk
          if-no-files-found: error

  publish:
    name: 发布 · 签名 + 清单 + 双源分发
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      REIN_UPDATE_TOKEN: ${{ secrets.REIN_UPDATE_TOKEN }}
      REIN_UPDATE_BASE_URL: ${{ vars.REIN_UPDATE_BASE_URL || 'http://47.100.36.179:8787' }}
      REIN_GITHUB_REPO: ${{ github.repository }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          path: incoming
      - name: 解析版本号
        id: ver
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            V="${{ inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            V="${GITHUB_REF#refs/tags/v}"
          else
            V=$(node -p "require('./package.json').version")
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          echo "版本：$V"
      - name: 组装 --target 参数
        id: targets
        shell: bash
        run: |
          ARGS=""
          EXE=$(find incoming/windows-installer -name '*.exe' | head -n1)
          APK=$(find incoming/android-apk -name '*.apk' | head -n1)
          [ -n "$EXE" ] && ARGS="$ARGS --target windows-x86_64=$EXE"
          [ -n "$APK" ] && ARGS="$ARGS --target android-aarch64=$APK"
          if [ -z "$ARGS" ]; then echo "没有任何产物，无法发布"; exit 1; fi
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"
          echo "将发布：$ARGS"
      # 发布器是本地与 CI 共用的同一份代码：签名 → 组装两套清单 → 推服务端 + 发 Release。
      # 没配 REIN_UPDATE_TOKEN 时会自动只发 GitHub（脚本内部处理），不会让流水线白跑。
      - name: 发布
        shell: bash
        run: |
          node scripts/release/publish.mjs \
            --version "${{ steps.ver.outputs.version }}" \
            --to server,github \
            ${{ steps.targets.outputs.args }}
      - name: 发布后校验（以客户端视角重跑一遍验签与下载）
        run: node scripts/release/verify.mjs --manifest "https://github.com/${{ github.repository }}/releases/latest/download/latest.json" || true
