name: Deploy site to GitHub Pages

# 只手动触发 —— 这是给「发布官网」留的一键入口，不会在 push 时自己跑。
# 仓库设置里把 Pages 的 Source 选成 "GitHub Actions" 之后，在这里点 Run workflow 即可。
#
# 站点是**单页静态产物**，base 走 './'，所以子路径（/rein/）下也能直接工作。

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build          # tsc --noEmit && vite build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
