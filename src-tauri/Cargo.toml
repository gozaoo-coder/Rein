[package]
name = "rein"
version = "0.5.11"
description = "Rein · 全能生活助理"
edition = "2021"
rust-version = "1.77"

[lib]
name = "rein_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# bundled = 自带 SQLite 源码（四端一致）；hooks = update_hook（同步的变更捕获靠它，
# 比逐表写 70 多条 SQL 触发器少一份维护面）。
rusqlite = { version = "0.32", features = ["bundled", "hooks"] }
thiserror = "2"
chrono = "0.4"
# AI web 工具（web_search / web_fetch）：服务端抓取避免 WebView CORS 限制
ureq = "2"
# AI agent 内核（modules/ai/agent）：LLM 流式请求。reqwest 已由 tauri 传入依赖图。
# 必须 default-features = false + rustls-no-provider —— reqwest 0.13 的 `rustls`
# 特性等于 aws-lc-rs（C 代码 + cmake，毒化 Android 交叉编译）；no-provider 复用
# 依赖图里既有的 ring provider（tokio-tungstenite 的语音 WS 已在生产用它）。
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream", "json"] }
# rustls 的 ring provider：reqwest 走 no-provider 后由我们在建 Client 前 install_default
# （见 modules/ai/agent/llm/http.rs）。ring 是纯 Rust 实现，Android 交叉编译零原生依赖。
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
async-trait = "0.1"
url = "2"
html2text = "0.17"
# 分享收件箱（share_read 返回文件内容给前端）
base64 = "0.22"
# 校园教务域（modules/campus）：树维 EAMS 门户登录用 JSEncrypt 同款 PKCS#1 v1.5 加密口令。
# 纯 Rust 实现（num-bigint-dig），不引入 openssl，四端交叉编译无需原生依赖。
rsa = "0.9"
rand = "0.8"
# 语音对话（modules/voice）：豆包 ASR/TTS WS 客户端 + gzip 二进制协议 + 音频落盘
tokio = { version = "1", features = ["sync", "macros", "rt", "time"] }
tokio-tungstenite = { version = "0.23", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
flate2 = "1"
uuid = { version = "1", features = ["v4"] }
# 端侧 embedding（modules/kb，见 docs/kb-embed-benchmark.md）：
# 必须 default-features = false —— ort 的默认 feature 含 download-binaries，与 load-dynamic 冲突；
# 只开 load-dynamic（运行时由我们显式 init_from），三端交叉编译就不需要任何原生链接配置。
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["load-dynamic", "ndarray", "api-27"] }
ndarray = "0.17"
# 显式选 fancy-regex（纯 Rust）而非默认的 onig：后者要编 oniguruma 的 C 代码，是 Android 交叉编译的常见坑。
# 注意 default-features = false 时 tokenizers 会直接 compile_error!，必须二选一。
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
# 在线更新（modules/update）：minisign-verify 正是 tauri-plugin-updater 内部用的那个 crate，
# 验签行为与官方客户端逐字节一致 —— 发布侧用官方 CLI 签名，两边必须对得上。
minisign-verify = "0.2"
sha2 = "0.10"
semver = "1"
# 多设备同步（modules/sync）：配对与端到端加密。三件都是纯 Rust 实现 ——
# Android arm64 交叉编译不需要任何原生依赖（rsa 那条注释同理）。
# x25519 走 static_secrets：密钥要落库，会话密钥那种一次性类型不能序列化。
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
hmac = "0.12"
tauri-plugin-notification = "2"

[profile.release]
codegen-units = 1
lto = true
strip = true

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

# HEIF/HEIC 解码（modules/media）：Windows 侧经影像组件（WIC）把 HEIC 转成 JPEG。
# 版本锁 0.61.3 —— 与 Cargo.lock 里 webview2-com 已经引入的那份同一个版本，
# 免得为了几行解码代码再编译一整套 windows bindings。
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61.3", features = [
  "Win32_Graphics_Imaging",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Memory",
] }
