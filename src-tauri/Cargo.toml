[package]
name = "rein"
version = "0.2.0"
description = "Rein · 健康生活运动管理"
edition = "2021"
rust-version = "1.77"

[lib]
name = "rein_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
chrono = "0.4"
# AI web 工具（web_search / web_fetch）：服务端抓取避免 WebView CORS 限制
ureq = "2"
url = "2"
html2text = "0.17"

[profile.release]
codegen-units = 1
lto = true
strip = true

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
