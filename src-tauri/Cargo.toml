[package]
name = "rein"
version = "0.1.0"
edition = "2021"

[lib]
name = "rein_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time", "fs", "io-util"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
base64 = "0.22"
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip"] }

[target.'cfg(target_env = "ohos")'.dependencies]
napi-ohos = { version = "1.1" }
napi-derive-ohos = "1.1"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.dev]
incremental = false

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# 鸿蒙 HarmonyOS 适配：将 tauri 及其相关 crate 指向 feat/open-harmony 分支
# 注意：[patch.crates-io] 是全局生效的（Cargo 机制限制，无法按 target 条件化）
# 这会让所有平台构建都使用 git 源的 tauri 2.11.x，而非 crates.io 的 2.11.5
# 仅在 feat/harmonyos-verify 分支使用；验证桌面端无回归后方可合并
[patch.crates-io]
tauri = { git = "https://github.com/tauri-apps/tauri", branch = "feat/open-harmony" }
tauri-build = { git = "https://github.com/tauri-apps/tauri", branch = "feat/open-harmony" }
tauri-runtime = { git = "https://github.com/tauri-apps/tauri", branch = "feat/open-harmony" }
tauri-runtime-wry = { git = "https://github.com/tauri-apps/tauri", branch = "feat/open-harmony" }
tauri-utils = { git = "https://github.com/tauri-apps/tauri", branch = "feat/open-harmony" }
tauri-macros = { git = "https://github.com/tauri-apps/tauri", branch = "feat/open-harmony" }
wry = { git = "https://github.com/tauri-apps/wry", branch = "feat/open-harmony" }
tao = { git = "https://github.com/tauri-apps/tao", branch = "feat/open-harmony" }
openharmony-ability = { git = "https://github.com/harmony-contrib/openharmony-ability.git" }
openharmony-ability-derive = { git = "https://github.com/harmony-contrib/openharmony-ability.git" }
